<!DOCTYPE html>
<html>
    <head>
        <title>Caleb's blog</title>
    </head>
    <body>
        <header>
            <h1><a href="/">Caleb's Blog</a></h1>
        </header>

        {% for post in posts %}
        <article>
        <h2><a href="">{{ post.title }}</a></h2>
        <time>published: {{ post.published_date|date:"M d, Y" }}</time>
        <p>{{ post.text|linebreaksbr }}</p>
        </article>
{% endfor %}

    </body>
</html>
